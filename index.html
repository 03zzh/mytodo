<style>
:root{
  --bg:#eaf4ff; --panel:rgba(255,255,255,.82); --panel2:rgba(232,244,255,.72);
  --text:#1e3a5f; --muted:#6b9bcf;
  --border:#bcdcff; --accent:#2b8cf0; --accent2:#00b4d8; --accent-soft:#dbeeff;
  --q1:#e6396b; --q2:#f48c06; --q3:#0891b2; --q4:#9bbcd6;
  --ok:#0a9d6e; --radius:14px;
  --shadow:0 1px 2px rgba(60,120,200,.06),0 8px 24px rgba(60,120,200,.10);
  --glass:blur(16px) saturate(1.3);
}
[data-theme="dark"]{
  --bg:#081427; --panel:rgba(16,38,72,.62); --panel2:rgba(20,44,80,.56);
  --text:#d6e8ff; --muted:#7fa8d8;
  --border:#1e3a66; --accent:#4ea3ff; --accent2:#00d4e6; --accent-soft:#122a52;
  --q1:#ff6b9d; --q2:#ffb454; --q3:#38bdf8; --q4:#5a86b0;
  --ok:#4ee6a8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  --glass:blur(16px) saturate(1.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; transition:background .25s,color:.25s;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* 飘浮的云朵装饰 */
.cloud{position:absolute;pointer-events:none;opacity:.5;animation:drift 14s ease-in-out infinite}
.cloud.c1{left:22%;top:16%;width:120px;animation-delay:0s}
.cloud.c2{right:30%;top:60%;width:90px;opacity:.35;animation-delay:3s;animation-duration:18s}
.cloud.c3{left:60%;top:24%;width:70px;opacity:.30;animation-delay:6s;animation-duration:16s}
@keyframes drift{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-20px) rotate(8deg)}
}
.mascot{
  position:fixed;z-index:5;pointer-events:none;
  border-radius:18px;
  border:2px solid rgba(255,255,255,.75);
  box-shadow:0 10px 26px rgba(60,120,200,.22);
  background:rgba(255,255,255,.35);
  animation:bob 7s ease-in-out infinite;
}
[data-theme="dark"] .mascot{opacity:.55;border-color:rgba(255,255,255,.26);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.m1{left:calc(236px + 12px);bottom:12px;width:112px}
.m2{right:12px;bottom:12px;width:96px;animation-duration:8.6s;animation-delay:.9s}
.m3{right:104px;top:12px;width:84px;opacity:.85;animation-duration:9.4s;animation-delay:1.8s}
body.nobg .bg-layer,body.nobg .mascot{display:none}
@keyframes bob{
  0%,100%{transform:translateY(0) rotate(-1.6deg)}
  50%{transform:translateY(-15px) rotate(1.6deg)}
}
.bg-deco{position:absolute;animation:drift 11s ease-in-out infinite}
@keyframes drift{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-20px) rotate(10deg)}
}
.d1{left:30%;top:12%;width:104px;opacity:.75}
.d2{right:26%;top:34%;width:56px;opacity:.80;animation-delay:1.2s;animation-duration:9s}
.d3{left:16%;top:52%;width:46px;opacity:.70;animation-delay:2.4s;animation-duration:10s}
.d4{right:6%;top:56%;width:52px;opacity:.72;animation-delay:3.1s}
.d5{left:45%;bottom:14%;width:40px;opacity:.60;animation-delay:1.7s;animation-duration:13s}
.d6{right:38%;top:9%;width:34px;opacity:.65;animation-delay:4s;animation-duration:12s}

/* 玻璃拟态：让毛玻璃透出背景 */
.sidebar,.stat-card,.kpi,.task,.quick-add,.chips,.search,.empty,.modal,.toast,
.icon-btn,.btn,.qa-sel,.qa-time,.inp,.sel,.ta,.seg button,.days button{
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
}

.app{display:grid;grid-template-columns:236px 1fr;height:100vh;overflow:hidden;position:relative;z-index:1}

/* ---------- Sidebar ---------- */
.sidebar{
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 14px;gap:18px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-logo{
  width:32px;height:32px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#fff;font-size:17px;font-weight:700;
  box-shadow:0 4px 12px rgba(99,102,241,.35);
}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.3px}
.brand-sub{font-size:11px;color:var(--muted);margin-top:-2px}

.nav-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:1px;padding:0 8px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;
  color:var(--muted);font-weight:500;transition:.15s;width:100%;text-align:left;
}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .ico{width:18px;text-align:center;font-size:15px}
.nav-item .count{
  margin-left:auto;font-size:11px;font-weight:600;background:var(--panel2);
  padding:1px 7px;border-radius:20px;color:var(--muted);
}
.nav-item.active .count{background:rgba(99,102,241,.15);color:var(--accent)}
.nav-item .count.warn{background:rgba(239,68,68,.14);color:var(--q1)}

.tag-box{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.tag-chip{
  font-size:12px;padding:3px 9px;border-radius:20px;background:var(--panel2);
  color:var(--muted);border:1px solid var(--border);transition:.15s;
}
.tag-chip:hover{border-color:var(--accent);color:var(--accent)}
.tag-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--border)}
.mini-btn{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
  font-size:12.5px;color:var(--muted);transition:.15s;width:100%;text-align:left;
}
.mini-btn:hover{background:var(--panel2);color:var(--text)}
.mini-btn.on{color:var(--accent);font-weight:600}
.mini-btn.hl{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(255,95,162,.32);
}
.mini-btn.hl:hover{filter:brightness(1.07);color:#fff}

/* ---------- Main ---------- */
.main{overflow-y:auto;padding:26px 32px 60px;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.date-nav{display:flex;align-items:center;gap:10px}
.date-title{font-size:24px;font-weight:700;letter-spacing:-.4px}
.date-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.icon-btn{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  border:1px solid var(--border);background:var(--panel);color:var(--muted);transition:.15s;font-size:14px;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{
  padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;transition:.15s;
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;
  box-shadow:0 4px 14px rgba(99,102,241,.3);
}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel2)}

/* Stats */
.stats{display:grid;grid-template-columns:auto 1fr;gap:16px}
.stat-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);
}
.ring-wrap{display:flex;align-items:center;gap:18px;min-width:250px}
.ring-info .big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.ring-info .lbl{font-size:12.5px;color:var(--muted);margin-top:1px}
.ring-info .sub{font-size:11.5px;color:var(--muted);margin-top:8px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;
}
.kpi .k-val{font-size:25px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:baseline;gap:4px}
.kpi .k-unit{font-size:12px;font-weight:500;color:var(--muted)}
.kpi .k-lbl{font-size:12px;color:var(--muted);margin-top:3px}
.kpi .k-bar{height:5px;border-radius:3px;background:var(--panel2);margin-top:11px;overflow:hidden}
.kpi .k-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.chart-card{grid-column:1/-1}
canvas{display:block}

/* Quick add */
.quick-add{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);
  transition:border-color .2s;
}
.quick-add:focus-within{border-color:var(--accent)}
.qa-input{flex:1;border:none;outline:none;background:transparent;font-size:14.5px;padding:6px 4px;min-width:0}
.qa-input::placeholder{color:var(--muted)}
.qa-sel,.qa-time{
  border:1px solid var(--border);background:var(--panel2);border-radius:8px;
  padding:6px 9px;outline:none;transition:.15s;font-size:13px;
}
.qa-sel:focus,.qa-time:focus{border-color:var(--accent)}
.qa-time{width:92px}

/* List toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:10px;border:1px solid var(--border)}
.chip{padding:5px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);transition:.15s}
.chip:hover{color:var(--text)}
.chip.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tool-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.search{
  border:1px solid var(--border);background:var(--panel);border-radius:9px;
  padding:7px 12px;width:170px;outline:none;transition:.15s;
}
.search:focus{border-color:var(--accent);width:210px}

/* Task list */
.list{display:flex;flex-direction:column;gap:8px}
.task{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:13px 15px;display:flex;align-items:flex-start;gap:12px;
  box-shadow:var(--shadow);transition:.18s;position:relative;overflow:hidden;
}
.task:hover{border-color:var(--accent);transform:translateY(-1px)}
.task.dragging{opacity:.4}
.task.overdue{border-left:3px solid var(--q1)}
.task.done{opacity:.55}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-check{
  width:20px;height:20px;border-radius:6px;border:2px solid var(--border);flex:none;margin-top:1px;
  display:grid;place-items:center;transition:.18s;color:transparent;
}
.t-check:hover{border-color:var(--ok)}
.task.done .t-check{background:var(--ok);border-color:var(--ok);color:#fff}
.t-body{flex:1;min-width:0}
.t-title{font-size:14.5px;font-weight:600;word-break:break-word;line-height:1.45}
.t-note{font-size:12.5px;color:var(--muted);margin-top:3px;word-break:break-word}
.t-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;align-items:center}
.pill{
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;
  display:inline-flex;align-items:center;gap:4px;
}
.pill.q1{background:rgba(239,68,68,.13);color:var(--q1)}
.pill.q2{background:rgba(245,158,11,.15);color:var(--q2)}
.pill.q3{background:rgba(59,130,246,.13);color:var(--q3)}
.pill.q4{background:rgba(148,163,184,.16);color:var(--q4)}
.pill.time{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.pill.repeat{background:rgba(139,92,246,.13);color:var(--accent2)}
.pill.tag{background:var(--accent-soft);color:var(--accent)}
.pill.date{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.t-actions{display:flex;gap:2px;opacity:0;transition:.15s;flex:none}
.task:hover .t-actions{opacity:1}
.act-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);font-size:14px;transition:.15s}
.act-btn:hover{background:var(--panel2);color:var(--text)}
.act-btn.del:hover{background:rgba(239,68,68,.12);color:var(--q1)}
.drag-handle{cursor:grab;color:var(--border);font-size:15px;padding:0 2px}
.drag-handle:active{cursor:grabbing}
.sec-title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px;margin:14px 0 -2px}

.empty{
  text-align:center;padding:52px 20px;color:var(--muted);
  background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);
}
.empty .e-emoji{font-size:38px;margin-bottom:10px;opacity:.6}
.empty .e-t{font-weight:600;color:var(--text);margin-bottom:4px}

/* Modal */
.mask{
  position:fixed;inset:0;background:rgba(10,12,20,.55);backdrop-filter:blur(3px);
  display:grid;place-items:center;z-index:100;padding:20px;opacity:0;pointer-events:none;transition:.2s;
}
.mask.show{opacity:1;pointer-events:auto}
.modal{
  background:linear-gradient(180deg,rgba(255,253,254,.95),rgba(255,249,252,.95));
  border:1px solid var(--border);border-radius:18px;width:100%;max-width:520px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);transform:translateY(12px) scale(.98);transition:.22s;
  max-height:90vh;overflow-y:auto;
}
.mask.show .modal{transform:none}
[data-theme="dark"] .modal{background:linear-gradient(180deg,rgba(56,32,48,.96),rgba(46,26,40,.96))}
.m-head{padding:20px 22px 0;display:flex;align-items:center}
.m-head h3{font-size:17px;font-weight:700}
.m-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp,.sel,.ta{
  border:1px solid var(--border);background:var(--panel2);border-radius:9px;
  padding:9px 12px;outline:none;transition:.15s;width:100%;
}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--accent);background:var(--panel)}
.ta{resize:vertical;min-height:62px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{
  padding:8px 4px;border-radius:8px;border:1px solid var(--border);font-size:12px;
  font-weight:600;color:var(--muted);transition:.15s;
}
.seg button:hover{border-color:var(--accent)}
.seg button.sq1.on{background:rgba(239,68,68,.13);border-color:var(--q1);color:var(--q1)}
.seg button.sq2.on{background:rgba(245,158,11,.15);border-color:var(--q2);color:var(--q2)}
.seg button.sq3.on{background:rgba(59,130,246,.13);border-color:var(--q3);color:var(--q3)}
.seg button.sq4.on{background:rgba(148,163,184,.16);border-color:var(--q4);color:var(--q4)}
.days{display:flex;gap:5px}
.days button{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--border);
  font-size:12px;color:var(--muted);transition:.15s;
}
.days button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.m-foot{padding:0 22px 20px;display:flex;gap:10px;justify-content:flex-end}

/* Toasts */
.toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 16px;
  box-shadow:0 12px 32px rgba(0,0,0,.22);display:flex;align-items:center;gap:12px;
  min-width:280px;max-width:400px;animation:slideIn .3s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.toast.out{animation:slideOut .25s forwards}
@keyframes slideOut{to{transform:translateX(60px);opacity:0}}
.toast .t-ico{font-size:19px;flex:none}
.toast .t-txt{flex:1;min-width:0}
.toast .t-t{font-weight:600;font-size:13.5px}
.toast .t-d{font-size:12px;color:var(--muted);margin-top:1px}
.toast .t-act{font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap;padding:4px 8px;border-radius:7px}
.toast .t-act:hover{background:var(--accent-soft)}
.toast .t-close{color:var(--muted);font-size:16px;flex:none;opacity:.6}
.toast .t-close:hover{opacity:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}

@media(max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .m1{width:74px;left:8px;bottom:8px;opacity:.75}
  .m2{width:66px;right:8px;bottom:8px;opacity:.75}
  .m3{display:none}

  .nav-label{display:none}
  .side-foot{margin-top:0;padding-top:0;border-top:none;flex-direction:row;gap:5px}
  .side-foot .mini-btn{padding:6px 9px;font-size:12px}
  .side-foot .mini-btn span:last-child{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav-item{padding:6px 12px;white-space:nowrap;font-size:13px}
  .nav-item .count{display:none}
  .brand{padding:0}
  .brand-sub{display:none}
  .main{padding:18px 16px 50px;overflow:visible}

  .stat-grid{grid-template-columns:1fr}
  .quick-add{flex-wrap:wrap}
  .qa-input{flex:1 1 100%;order:-1}
  .search{width:130px}
  .search:focus{width:150px}
}
</style>

    </div>

    <div class="toolbar">
      <div class="chips" id="statusChips">
        <button class="chip active" data-st="all">全部</button>
        <button class="chip" data-st="todo">未完成</button>
        <button class="chip" data-st="done">已完成</button>
      </div>
      <div class="chip" id="sortWrap" style="padding:0">
        <select class="qa-sel" id="sortSel" style="border:none;background:transparent;padding:7px 12px">
          <option value="smart">智能排序</option>
          <option value="time">按提醒时间</option>
          <option value="prio">按优先级</option>
          <option value="manual">手动排序（可拖拽）</option>
        </select>
      </div>
      <div class="tool-right">
        <input class="search" id="search" placeholder="搜索任务…">
        <button class="btn ghost" id="clearDone" style="font-size:12.5px">清除已完成</button>
      </div>
    </div>

    <section class="list" id="list"></section>
  </main>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="m-head"><h3 id="mTitle">新建任务</h3></div>
    <div class="m-body">
      <div class="field">
        <label>任务标题</label>
        <input class="inp" id="fTitle" placeholder="要做的事…" maxlength="120">
      </div>
      <div class="field">
        <label>备注（可选）</label>
        <textarea class="ta" id="fNote" placeholder="补充说明…"></textarea>
      </div>
      <div class="field">
        <label>优先级 · 四象限</label>
        <div class="seg" id="fPrio">
          <button class="sq1" data-v="q1">紧急重要</button>
          <button class="sq2" data-v="q2">重要不紧急</button>
          <button class="sq3" data-v="q3">紧急不重要</button>
          <button class="sq4" data-v="q4">不紧急不重要</button>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>重复方式</label>
          <select class="sel" id="fRepeat">
            <option value="none">不重复（一次性）</option>
            <option value="daily">每天</option>
            <option value="weekday">工作日（周一至周五）</option>
            <option value="weekly">每周指定几天</option>
            <option value="monthly">每月指定一天</option>
          </select>
        </div>
        <div class="field" id="fDateWrap">
          <label>日期</label>
          <input class="inp" type="date" id="fDate">
        </div>
        <div class="field" id="fDaysWrap" style="display:none">
          <label>选择星期</label>
          <div class="days" id="fDays">
            <button data-d="1">一</button><button data-d="2">二</button><button data-d="3">三</button>
            <button data-d="4">四</button><button data-d="5">五</button><button data-d="6">六</button>
            <button data-d="0">日</button>
          </div>
        </div>
        <div class="field" id="fMonthWrap" style="display:none">
          <label>每月几号</label>
          <input class="inp" type="number" id="fMonthDay" min="1" max="31" value="1">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>提醒时间（留空则不提醒）</label>
          <input class="inp" type="time" id="fTime">
        </div>
        <div class="field">
          <label>标签（逗号分隔）</label>
          <input class="inp" id="fTags" placeholder="工作, 学习">
        </div>
      </div>
    </div>
    <div class="m-foot">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存</button>
    </div>
  </div>
</div>

const shiftD = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ds(d); };

});
let S = def();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {

      S.settings = Object.assign(def().settings, o.settings || {});
    } else {
      S = def(); seed();
    }
  } catch (e) { S = def(); seed(); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }

    mk({ title: '试试点击左侧「开启桌面通知」', prio: 'q3', time: '', repeat: 'none', date: t, tags: ['上手'] })
  ];
}

function mk(o) {
  return {
    id: uid(), title: o.title || '未命名任务', note: o.note || '', prio: o.prio || 'q2',
    repeat: o.repeat || 'none', date: o.date || todayStr(), days: o.days || [], monthDay: o.monthDay || 1,
    time: o.time || '', tags: o.tags || [],
    done: false, doneAt: null, doneDates: [], createdAt: Date.now()
  };
}

/* ============ 任务判定 ============ */
function isActive(task, dateS) {
  if (task.repeat === 'none') return task.date === dateS;
  const d = parseD(dateS), wd = d.getDay(), dd = d.getDate();
  if (task.repeat === 'daily') return true;
  if (task.repeat === 'weekday') return wd >= 1 && wd <= 5;
  if (task.repeat === 'weekly') return (task.days || []).includes(wd);
  if (task.repeat === 'monthly') return task.monthDay === dd;
  return false;
}
function isDone(task, dateS) {
  return task.repeat === 'none' ? !!task.done : (task.doneDates || []).includes(dateS);
}
function toggleDone(task) {
  const d = viewDate;
  if (task.repeat === 'none') {
    task.done = !task.done;
    task.doneAt = task.done ? Date.now() : null;
  } else {
    task.doneDates = task.doneDates || [];
    const i = task.doneDates.indexOf(d);
    if (i >= 0) task.doneDates.splice(i, 1); else task.doneDates.push(d);
  }
  afterMutate();
}
function isOverdue(task) {
  return task.repeat === 'none' && !task.done && task.date < todayStr();
}
function isFuture(task) {
  return task.repeat === 'none' && !task.done && task.date > todayStr();
}

function afterMutate() { snapToday(); save(); render(); checkCelebrate(); }

function snapToday() {
  const t = todayStr();
  const list = S.tasks.filter(x => isActive(x, t));
  S.history[t] = { total: list.length, done: list.filter(x => isDone(x, t)).length };
}

/* ============ 视图数据 ============ */
function viewTasks() {
  let list;
  const v = S.settings.view;
  if (v === 'day') list = S.tasks.filter(x => isActive(x, viewDate));
  else if (v === 'overdue') list = S.tasks.filter(isOverdue);
  else if (v === 'future') list = S.tasks.filter(isFuture);
  else list = S.tasks.filter(x => x.repeat !== 'none' || !x.done);

  if (v === 'day' || v === 'all') {
    const st = S.settings.status;
    if (st === 'todo') list = list.filter(x => !isDone(x, viewDate));
    if (st === 'done') list = list.filter(x => isDone(x, viewDate));
  }
  if (S.settings.tag) list = list.filter(x => (x.tags || []).includes(S.settings.tag));
  const q = (S.settings.search || '').trim().toLowerCase();
  if (q) list = list.filter(x => (x.title + ' ' + x.note + ' ' + (x.tags || []).join(' ')).toLowerCase().includes(q));
  return sortTasks(list);
}
function sortTasks(list) {
  const m = S.settings.sort;
  const arr = [...list];
  if (m === 'manual') return arr;
  if (m === 'time') return arr.sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
  if (m === 'prio') return arr.sort((a, b) => PRIO[a.prio].w - PRIO[b.prio].w);
  return arr.sort((a, b) => {
    const da = isDone(a, viewDate) ? 1 : 0, db = isDone(b, viewDate) ? 1 : 0;
    if (da !== db) return da - db;
    const pa = PRIO[a.prio].w, pb = PRIO[b.prio].w;
    if (pa !== pb) return pa - pb;
    return (a.time || '99:99').localeCompare(b.time || '99:99');
  });
}
function counts() {
  const t = todayStr();
  const overdue = S.tasks.filter(isOverdue).length;
  const future = S.tasks.filter(isFuture).length;
  const dayN = S.tasks.filter(x => isActive(x, viewDate)).length;
  const allN = S.tasks.filter(x => x.repeat !== 'none' || !x.done).length;
  return { overdue, future, day: dayN, all: allN };
}
function allTags() {
  const s = new Set();
  S.tasks.forEach(t => (t.tags || []).forEach(x => s.add(x)));
  return [...s].sort();
}

/* ============ 渲染 ============ */
function render() {
  renderNav(); renderTags(); renderDate(); renderStats(); renderList();
}

function renderNav() {

function renderDate() {
  const d = parseD(viewDate), t = todayStr();

  $('#dateTitle').textContent = `${d.getMonth() + 1} 月 ${d.getDate()} 日 · 周${WD[d.getDay()]}`;
  $('#dateSub').textContent = `${rel}${diff === 0 ? ' · ' + greet() : ''}`;
}
function greet() {

  return '晚上好，收个尾吧';
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function renderList() {

    return;
  }

  list.forEach((t, idx) => {

    if (key && key !== lastKey) {

}
function labelOf(name) {
  return { '紧急重要': '马上做', '重要不紧急': '计划做', '紧急不重要': '委托做', '不紧急不重要': '少做' }[name] || '';
}

function taskHTML(t, idx) {
  const done = isDone(t, viewDate);
  const p = PRIO[t.prio];
  const meta = [`<span class="pill ${p.cls}">${p.name}</span>`];
  if (t.time) meta.push(`<span class="pill time">🔔 ${t.time}</span>`);
  if (t.repeat !== 'none') {
    let r = REPEAT_NAME[t.repeat];
    if (t.repeat === 'weekly') r = '每周 ' + (t.days || []).sort().map(d => '周' + WD[d]).join(' ');
    if (t.repeat === 'monthly') r = `每月 ${t.monthDay} 号`;
    meta.push(`<span class="pill repeat">↻ ${r}</span>`);
  }
  if (t.repeat === 'none') {
    const rel = t.date === todayStr() ? '今天' : t.date === shiftD(todayStr(), 1) ? '明天'
      : t.date === shiftD(todayStr(), -1) ? '昨天' : t.date.slice(5);
    meta.push(`<span class="pill date">📌 ${rel}</span>`);
  }
  (t.tags || []).forEach(x => meta.push(`<span class="pill tag"># ${esc(x)}</span>`));
  return `
  <div class="task ${done ? 'done' : ''} ${isOverdue(t) ? 'overdue' : ''}" data-id="${t.id}" draggable="${S.settings.sort === 'manual'}">
    <button class="t-check" data-act="toggle" title="完成">✓</button>
    <div class="t-body" data-act="edit" style="cursor:pointer">
      <div class="t-title">${esc(t.title)}</div>

      <div class="t-meta">${meta.join('')}</div>
    </div>

      <button class="act-btn" data-act="edit" title="编辑">✏️</button>
      <button class="act-btn del" data-act="del" title="删除">🗑</button>
    </div>
  </div>`;
}

function bindList() {
  $$('#list .task').forEach(el => {
    const id = el.dataset.id;
    const task = () => S.tasks.find(t => t.id === id);
    el.querySelector('[data-act="toggle"]').onclick = () => toggleDone(task());
    el.querySelectorAll('[data-act="edit"]').forEach(b => b.onclick = () => openModal(task()));
    el.querySelector('[data-act="del"]').onclick = () => {
      const t = task(), i = S.tasks.indexOf(t);
      S.tasks.splice(i, 1); afterMutate();
      toast('🗑️', '已删除', t.title, '撤销', () => { S.tasks.splice(i, 0, t); afterMutate(); });
    };
    if (S.settings.sort === 'manual') {
      el.ondragstart = e => { dragId = id; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; };
      el.ondragend = () => el.classList.remove('dragging');
      el.ondragover = e => { e.preventDefault(); };
      el.ondrop = e => {
        e.preventDefault();
        if (!dragId || dragId === id) return;
        const a = S.tasks.findIndex(t => t.id === dragId), b = S.tasks.findIndex(t => t.id === id);
        const [m] = S.tasks.splice(a, 1); S.tasks.splice(b, 0, m);
        save(); render();
      };
    }
  });
}
let dragId = null;

/* ============ 图表 ============ */
function renderStats() {
  const t = todayStr();
  const h = S.history[t] || { total: 0, done: 0 };
  const pct = h.total ? Math.round(h.done / h.total * 100) : 0;
  drawRing($('#ring'), pct);
  $('#ringPct').textContent = pct + '%';
  $('#ringSub').textContent = h.total ? `已完成 ${h.done} / ${h.total} 项` : '还没有任务，添加一个吧';

  const streak = calcStreak();
  $('#kStreak').textContent = streak;
  $('#kStreakBar').style.width = Math.min(100, streak / 21 * 100) + '%';
  $('#kDone').textContent = h.done;
  $('#kDoneBar').style.width = (h.total ? h.done / h.total * 100 : 0) + '%';
  const left = Math.max(0, h.total - h.done);
  $('#kLeft').textContent = left;
  $('#kLeftBar').style.width = (h.total ? left / h.total * 100 : 0) + '%';
  drawBars();
}

function calcStreak() {
  let n = 0, d = new Date();
  const chk = s => { const x = S.history[s]; return x && x.total > 0 && x.done === x.total; };
  if (!chk(ds(d))) d.setDate(d.getDate() - 1);
  while (chk(ds(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function fitCanvas(cv) {
  const r = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * r; cv.height = h * r;
  const c = cv.getContext && cv.getContext('2d');
  if (!c) return { c: null, w, h };          // 环境不支持 canvas 时不崩溃
  c.setTransform(r, 0, 0, r, 0, 0);
  return { c, w, h };
}
function css(v) { return getComputedStyle(document.body).getPropertyValue(v).trim(); }

function drawRing(cv, pct) {
  const { c, w, h } = fitCanvas(cv);
  if (!c) return;
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 9, r = R - 11;
  c.clearRect(0, 0, w, h);
  c.lineCap = 'round';
  c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2);
  c.strokeStyle = css('--border'); c.lineWidth = 11; c.stroke();
  if (pct > 0) {
    const g = c.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, css('--accent')); g.addColorStop(1, css('--accent2'));
    c.beginPath();
    c.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct / 100);
    c.strokeStyle = g; c.lineWidth = 11; c.stroke();
  }
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2);
  c.fillStyle = css('--panel2'); c.fill();
}

function drawBars() {
  const cv = $('#bars'), { c, w, h } = fitCanvas(cv);
  if (!c) return;
  c.clearRect(0, 0, w, h);
  const days = [], t = new Date();
  for (let i = 6; i >= 0; i--) { const d = new Date(t); d.setDate(d.getDate() - i); days.push(d); }
  const data = days.map(d => {
    const s = ds(d);
    if (s === todayStr()) { const l = S.tasks.filter(x => isActive(x, s)); return { total: l.length, done: l.filter(x => isDone(x, s)).length, s }; }
    return Object.assign({ total: 0, done: 0 }, S.history[s] || {});
  });
  const max = Math.max(1, ...data.map(d => d.total));
  const padB = 22, padT = 14, bw = Math.min(46, (w - 20) / 7 - 14);
  const step = w / 7;
  data.forEach((d, i) => {
    const x = i * step + (step - bw) / 2;
    const full = (h - padB - padT) * (d.total / max);
    const done = d.total ? full * (d.done / d.total) : 0;
    const y = h - padB - full;
    c.fillStyle = css('--panel2');
    roundRect(c, x, y, bw, Math.max(full, 3), 6); c.fill();
    if (done > 0) {
      const g = c.createLinearGradient(x, y, x, h);
      g.addColorStop(0, css('--accent2')); g.addColorStop(1, css('--accent'));
      c.fillStyle = g;
      roundRect(c, x, h - padB - done, bw, Math.max(done, 3), 6); c.fill();
    }
    c.fillStyle = css('--muted'); c.font = '11px -apple-system,sans-serif'; c.textAlign = 'center';
    c.fillText(i === 6 ? '今天' : WD[days[i].getDay()], x + bw / 2, h - 6);
    if (d.total > 0) {
      c.fillStyle = css('--text'); c.font = '600 11px -apple-system,sans-serif';
      c.fillText(`${d.done}/${d.total}`, x + bw / 2, h - padB - full - 4);
    }
  });
}
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

/* ============ 提醒 ============ */
function beep(times = 2) {
  if (!S.settings.sound) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = new AC();
    for (let i = 0; i < times; i++) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'sine'; o.frequency.value = i % 2 ? 660 : 880;
      const t0 = ac.currentTime + i * 0.22;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(.22, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.001, t0 + .2);
      o.start(t0); o.stop(t0 + .22);
    }
    setTimeout(() => ac.close(), 1200);
  } catch (e) { }
}
function toast(ico, title, desc, actLabel, actFn, ms = 6000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="t-ico">${ico}</div><div class="t-txt"><div class="t-t">${esc(title)}</div>${desc ? `<div class="t-d">${esc(desc)}</div>` : ''}</div>
    ${actLabel ? `<button class="t-act">${esc(actLabel)}</button>` : ''}<button class="t-close">×</button>`;
  $('#toasts').appendChild(el);
  const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 250); };
  el.querySelector('.t-close').onclick = close;
  const ab = el.querySelector('.t-act');
  if (ab) ab.onclick = () => { actFn && actFn(); close(); };
  setTimeout(close, ms);
}
function fireRemind(task) {
  beep(3);
  const body = `${PRIO[task.prio].name}${task.note ? ' · ' + task.note : ''}`;
  if (S.settings.notif === 'granted' && 'Notification' in window) {
    try {
      const n = new Notification('⏰ ' + task.title, { body, tag: task.id, requireInteraction: false });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) { toast('⏰', task.title, body, '知道了'); }
  } else {
    toast('⏰', '该做这件事了', task.title, '稍后 5 分钟', () => {
      const d = new Date(Date.now() + 5 * 60000);
      task.time = pad(d.getHours()) + ':' + pad(d.getMinutes());
      const f = S.fired[todayStr()] || (S.fired[todayStr()] = {});
      delete f[task.id]; save(); render();
    }, 12000);
  }
}
function checkReminders() {
  const t = todayStr(), hm = nowHM();
  const f = S.fired[t] || (S.fired[t] = {});
  S.tasks.forEach(task => {
    if (!task.time || task.time !== hm) return;
    if (f[task.id]) return;
    if (!isActive(task, t)) return;
    if (isDone(task, t)) return;
    f[task.id] = 1; save();
    fireRemind(task);
  });
  // 跨天：日期变了就整体重绘
  if (viewDate && S._lastDay !== t) { S._lastDay = t; if (viewDate < t) viewDate = t; snapToday(); save(); render(); }
}

/* ============ 庆祝 ============ */
function checkCelebrate() {
  const t = todayStr();
  const h = S.history[t];
  if (h && h.total > 0 && h.done === h.total && S.celebrate !== t) {
    S.celebrate = t; save();
    confetti();
    toast('🎉', '今日全部完成', `漂亮的 ${h.total} 连击，连续全勤 ${calcStreak()} 天`, '好的');
  }
}
function confetti() {
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const r = window.devicePixelRatio || 1;
  cv.width = innerWidth * r; cv.height = innerHeight * r;
  ctx.setTransform(r, 0, 0, r, 0, 0);
  const colors = [css('--accent'), css('--accent2'), css('--ok'), css('--q2'), css('--q3')];
  const P = [];
  for (let i = 0; i < 130; i++) P.push({
    x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .4,
    w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
    vy: 2 + Math.random() * 3.4, vx: -1.4 + Math.random() * 2.8,
    a: Math.random() * Math.PI, va: -.1 + Math.random() * .2, c: colors[i % colors.length]
  });
  let frame = 0;
  (function loop() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.a += p.va; p.vy += .015;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.globalAlpha = Math.max(0, 1 - frame / 220);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    frame++;
    if (frame < 220 && P.some(p => p.y < innerHeight + 40)) requestAnimationFrame(loop);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

/* ============ 弹窗 ============ */
let editing = null, formPrio = 'q2', formDays = [];
function openModal(task) {

function closeModal() { $('#mask').classList.remove('show'); editing = null; }
function syncPrio() { $$('#fPrio button').forEach(b => b.classList.toggle('on', b.dataset.v === formPrio)); }
function syncRepeat() {
  const v = $('#fRepeat').value;
  $('#fDateWrap').style.display = v === 'none' ? '' : 'none';
  $('#fDaysWrap').style.display = v === 'weekly' ? '' : 'none';
  $('#fMonthWrap').style.display = v === 'monthly' ? '' : 'none';
  $$('#fDays button').forEach(b => b.classList.toggle('on', formDays.includes(+b.dataset.d)));
}
function saveModal() {
  const title = $('#fTitle').value.trim();
  if (!title) { $('#fTitle').focus(); toast('⚠️', '标题不能为空', '给这件事起个名字吧'); return; }
  const o = {
    title, note: $('#fNote').value.trim(), prio: formPrio,
    repeat: $('#fRepeat').value, time: $('#fTime').value,
    tags: $('#fTags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean)
  };
  if (o.repeat === 'none') o.date = $('#fDate').value || todayStr();
  if (o.repeat === 'weekly') o.days = formDays.length ? [...formDays] : [parseD(viewDate).getDay()];
  if (o.repeat === 'monthly') o.monthDay = Math.min(31, Math.max(1, +$('#fMonthDay').value || 1));
  if (editing) Object.assign(editing, o);
  else S.tasks.push(mk(o));
  closeModal(); afterMutate();
}

/* ============ 事件 ============ */
function bind() {
  $('#qaAdd').onclick = quickAdd;
  $('#qaTitle').onkeydown = e => { if (e.key === 'Enter') quickAdd(); };
  $('#newTaskBtn').onclick = () => openModal(null);
  $('#mCancel').onclick = closeModal;
  $('#mSave').onclick = saveModal;
  $('#mask').onclick = e => { if (e.target === $('#mask')) closeModal(); };
  document.onkeydown = e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && e.target.id === 'fTitle') saveModal();
    if ((e.key === 'n' || e.key === 'N') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      e.preventDefault(); $('#qaTitle').focus();
    }
  };
  $$('#fPrio button').forEach(b => b.onclick = () => { formPrio = b.dataset.v; syncPrio(); });
  $('#fRepeat').onchange = syncRepeat;
  $$('#fDays button').forEach(b => b.onclick = () => {
    const d = +b.dataset.d;
    formDays.includes(d) ? formDays.splice(formDays.indexOf(d), 1) : formDays.push(d);
    syncRepeat();
  });

  $('#prevDay').onclick = () => { viewDate = shiftD(viewDate, -1); render(); };
  $('#nextDay').onclick = () => { viewDate = shiftD(viewDate, 1); render(); };
  $('#todayBtn').onclick = () => { viewDate = todayStr(); render(); };

  $$('#statusChips .chip').forEach(b => b.onclick = () => {
    $$('#statusChips .chip').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); S.settings.status = b.dataset.st; save(); render();
  });
  $('#sortSel').onchange = e => { S.settings.sort = e.target.value; save(); render(); };
  $('#search').oninput = e => { S.settings.search = e.target.value; render(); };
  $('#clearDone').onclick = () => {
    const n = S.tasks.filter(t => t.repeat === 'none' && t.done).length;
    if (!n) { toast('💡', '没有已完成的一次性任务', '重复任务保留着才能继续打卡'); return; }
    S.tasks = S.tasks.filter(t => !(t.repeat === 'none' && t.done));
    afterMutate(); toast('🧹', `已清除 ${n} 项`, '重复任务已保留');
  };

  $('#themeBtn').onclick = () => {
    S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark';
    applyTheme(); save(); renderStats();
  };
  $('#soundBtn').onclick = () => {
    S.settings.sound = !S.settings.sound; applySound(); save();
    if (S.settings.sound) beep(1);
  };
  $('#notifBtn').onclick = () => {
    if (!('Notification' in window)) {
      toast('⚠️', '浏览器不支持桌面通知', '仍会有页面内弹窗 + 提示音提醒', '知道了', null, 9000);
      return;
    }
    if (!window.isSecureContext) {
      toast('💡', '双击文件打开时通知会被禁用',
        '在本文件夹执行 python3 -m http.server 8000，再访问 http://localhost:8000 即可开启',
        '知道了', null, 18000);
      return;
    }
    if (Notification.permission === 'denied') {
      toast('🔒', '通知被浏览器拦截了',
        '点击地址栏左侧的锁形图标 → 网站设置 → 通知 → 改为「允许」，再刷新页面',
        '知道了', null, 18000);
      return;
    }
    let once = false;
    const done = p => {
      if (once) return; once = true;
      S.settings.notif = p; applyNotif(); save();
      if (p === 'granted') { toast('🔔', '到点提醒已开启', '到点弹出系统通知，浏览器最小化也能收到'); beep(1); }
      else toast('⚠️', '通知权限未授予', '仍会在页面内弹窗 + 提示音提醒');
    };
    try {
      const r = Notification.requestPermission(p => done(p));
      if (r && typeof r.then === 'function') r.then(done);
    } catch (e) { toast('⚠️', '无法申请通知权限', '将使用页面内弹窗提醒', '知道了', null, 9000); }
  };
  $('#exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `待办备份-${todayStr()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    toast('⬇️', '备份已导出', '换个设备用「导入数据」即可恢复');
  };
  $('#bgBtn').onclick = () => {
    S.settings.bg = !(S.settings.bg !== false);
    applyBg(); save();
  };
  $('#clearAllBtn').onclick = () => {
    if (!S.tasks.length) { toast('💬', '任务列表已经是空的啦', '先添加一些任务试试？'); return; }
    const n = S.tasks.length;
    toast('⚠️', '确定要删除全部待办？', '共 ' + n + ' 项任务将被永久移除', '删除全部', () => {
      S.tasks = [];
      S.history = {};
      S.fired = {};
      S.celebrate = '';
      afterMutate();
      toast('🧹🏹', '已清空全部 ' + n + ' 项', '可以重新开始啦');
    }, 10000, true);
  };
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const o = JSON.parse(rd.result);
        if (!o.tasks) throw 0;
        S = Object.assign(def(), o); S.settings = Object.assign(def().settings, o.settings || {});
        save(); applyAll(); render();
        toast('⬆️', `导入成功`, `共 ${S.tasks.length} 项任务`);
      } catch (err) { toast('⚠️', '导入失败', '文件格式不正确'); }
    };
    rd.readAsText(f); e.target.value = '';
  };
  window.addEventListener('resize', () => renderStats());
}

function quickAdd() {
  const v = $('#qaTitle').value.trim();
  if (!v) return;
  const t = mk({ title: v, prio: $('#qaPrio').value, time: $('#qaTime').value, repeat: 'none', date: viewDate });
  S.tasks.push(t);
  $('#qaTitle').value = ''; $('#qaTime').value = '';
  afterMutate();
  toast('✅', '已添加', t.title + (t.time ? ` · ${t.time} 提醒` : ''), '编辑', () => openModal(t), 3500);
}

function applyTheme() {
  document.documentElement.dataset.theme = S.settings.theme;
  $('#themeBtn').textContent = S.settings.theme === 'dark' ? '☀️' : '🌙';
}
function applySound() {
  $('#soundTxt').textContent = '提示音：' + (S.settings.sound ? '开' : '关');
  $('#soundBtn').classList.toggle('on', S.settings.sound);
}
function applyNotif() {
  const btn = $('#notifBtn'), txt = $('#notifTxt');
  btn.style.display = '';                       // 始终显示，不再隐藏
  btn.classList.remove('on', 'hl');
  if (!('Notification' in window)) { txt.textContent = '浏览器不支持通知'; return; }
  const p = Notification.permission;
  S.settings.notif = p;
  if (p === 'granted') {
    txt.textContent = '到点提醒：已开启'; btn.classList.add('on');
  } else if (!window.isSecureContext) {
    // file:// 下浏览器恒返回 denied，且没有网站设置页可改，只能引导走本地服务
    txt.textContent = '开启到点提醒（需本地服务）'; btn.classList.add('hl');
  } else if (p === 'denied') {
    txt.textContent = '通知被拦截，点此解决'; btn.classList.add('hl');
  } else {
    txt.textContent = '开启到点提醒'; btn.classList.add('hl');
  }
}
function applyBg() {
  const on = S.settings.bg !== false;
  $('#bgLayer').classList.toggle('off', !on);
  document.body.classList.toggle('nobg', !on);
  $('#bgTxt').textContent = '背景角色：' + (on ? '开' : '关');
  $('#bgBtn').classList.toggle('on', on);
}
function applyAll() {
  applyTheme(); applySound(); applyNotif(); applyBg();
  $('#sortSel').value = S.settings.sort;
  $$('#statusChips .chip').forEach(x => x.classList.toggle('active', x.dataset.st === S.settings.status));
}

/* ============ 启动 ============ */
load();
S._lastDay = todayStr();
applyAll();
snapToday(); save(); render();
bind();
setInterval(checkReminders, 10000);
setInterval(() => { if (S._lastDay !== todayStr()) { renderDate(); renderStats(); } }, 60000);
setTimeout(() => {
  if (S.settings.notif !== 'granted' && 'Notification' in window && Notification.permission === 'default') {
    toast('🔔', '开启到点提醒？', '点左侧「开启桌面通知」，最小化也能收到', '去开启', () => $('#notifBtn').click(), 12000);
  }
}, 3000);
</script>
</body>
</html>
